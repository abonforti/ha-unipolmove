name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Both validators track moving targets: hassfest follows Home Assistant
    # releases and the HACS action follows HACS itself, so a repository that
    # passes today can fail next month without a single commit.
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          # The repository has no topics set, and topics are a repository
          # setting rather than something a pull request can change. Drop this
          # line once they are added in the repository settings.
          ignore: topics
